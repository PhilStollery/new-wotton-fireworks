[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Reconcile paid price bands every 10 minutes on the published production deploy.
# The function itself still refuses to mutate Tito unless FIREWORKS_AUTOMATION_ENABLED=true.
[functions."tito-reconcile"]
  schedule = "*/10 * * * *"

[[headers]]
  for = "/*"
  [headers.values]
    cache-control = '''
    max-age=0,
    no-cache,
    no-store,
    must-revalidate'''
