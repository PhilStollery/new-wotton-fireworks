[build]
  command = "node scripts/check.mjs && node scripts/build.mjs"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Reconcile paid price bands every 10 minutes on the published production deploy.
# The function remains inert until priceAutomationEnabled is set to true in
# netlify/functions/_lib/integration-config-2026.mjs.
[functions."tito-reconcile"]
  schedule = "*/10 * * * *"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
